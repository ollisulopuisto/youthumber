name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Filter changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: .github/filters.yml

  frontend:
    name: Frontend (Node.js 24)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Run frontend unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend (Python + uv)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Ruff Linter
        run: uv run ruff check .

      - name: Ruff Format Check
        run: uv run ruff format --check .

      - name: Run Backend Tests
        run: uv run pytest

  backend-macos:
    # Vision, AVFoundation and Core Image only exist on macOS; on Ubuntu those tests
    # skip. Run on main pushes when backend files changed; PRs use the fast Linux suite.
    name: Backend (macOS frameworks)
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.backend == 'true'
    runs-on: macos-latest
    env:
      YOUTHUMBER_REQUIRE_MACOS: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run Backend Tests
        run: uv run pytest -rs

  required:
    name: CI required
    if: always()
    needs: [changes, frontend, backend, backend-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Check required CI results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          BACKEND_MACOS_RESULT: ${{ needs.backend-macos.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" || \
                ( "$FRONTEND_RESULT" != "success" && "$FRONTEND_RESULT" != "skipped" ) || \
                ( "$BACKEND_RESULT" != "success" && "$BACKEND_RESULT" != "skipped" ) || \
                ( "$BACKEND_MACOS_RESULT" != "success" && "$BACKEND_MACOS_RESULT" != "skipped" ) ]]; then
            echo "::error::One or more required CI jobs failed or were cancelled."
            exit 1
          fi
