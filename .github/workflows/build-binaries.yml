name: YouThumber direct morning DMG
'on':
  workflow_dispatch:
    inputs:
      source_sha:
        description: Expected latest merged main SHA. App checkout is pinned to this SHA.
        required: true
        type: string
permissions:
  contents: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
jobs:
  build-macos:
    name: Build macOS Standalone App (Apple Silicon)
    runs-on: macos-15
    steps:
    - name: Resolve latest merged main
      working-directory: ${{ github.workspace }}
      env:
        GH_TOKEN: ${{ github.token }}
        EXPECTED_SHA: ${{ inputs.source_sha }}
      run: 'set -euo pipefail

        SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)

        [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]

        test "$EXPECTED_SHA" = "$SHA"

        echo "BUILD_SHA=$SHA" >> "$GITHUB_ENV"

        echo "App source: $SHA" >> "$GITHUB_STEP_SUMMARY"

        '
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        ref: ${{ env.BUILD_SHA }}
    - name: Setup Node.js 24
      uses: actions/setup-node@v7
      with:
        node-version: 24
    - name: Install Node dependencies
      run: npm ci
    - name: Build Web Studio Frontend
      run: npm run build
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: false
        version: latest
        save-cache: false
    - name: Set up Python
      run: uv python install 3.13
    - name: Install Python dependencies
      run: uv sync --all-groups
    - name: Import Developer ID certificate
      env:
        BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: 'set -euo pipefail

        test -n "$BUILD_CERTIFICATE_BASE64"

        test -n "$P12_PASSWORD"

        test -n "$KEYCHAIN_PASSWORD"

        KEYCHAIN_PATH="$RUNNER_TEMP/youthumber-signing.keychain-db"

        CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"

        printf ''%s'' "$BUILD_CERTIFICATE_BASE64" | base64 -D -o "$CERTIFICATE_PATH"

        export KEYCHAIN_PATH="$KEYCHAIN_PATH" CERTIFICATE_PATH="$CERTIFICATE_PATH"

        export KEYCHAIN_PASSWORD="$KEYCHAIN_PASSWORD" P12_PASSWORD="$P12_PASSWORD"

        python3 scripts/macos_ci_credentials.py import-certificate

        security list-keychains -d user -s "$KEYCHAIN_PATH"

        rm -f "$CERTIFICATE_PATH"

        security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F ''Developer ID Application: Olli Sulopuisto (LWSR8T5392)''

        '
    - name: Read version
      id: version
      run: 'version=$(uv run python -c "import tomllib; print(tomllib.load(open(''pyproject.toml'',''rb''))[''project''][''version''])")

        echo "version=$version" >> "$GITHUB_OUTPUT"

        echo "Building YouThumber $version"

        '
    - name: Tag must match the version being released
      if: startsWith(github.ref, 'refs/tags/v')
      run: "if [ \"${GITHUB_REF_NAME}\" != \"v${{ steps.version.outputs.version }}\" ]; then\n  echo \"::error::Tag ${GITHUB_REF_NAME}\
        \ does not match pyproject version ${{ steps.version.outputs.version }}\"\n  exit 1\nfi\n"
    - name: Package macOS Standalone App Bundle
      env:
        APPLE_SIGNING_IDENTITY: 'Developer ID Application: Olli Sulopuisto (LWSR8T5392)'
      run: uv run python scripts/build_binaries.py --skip-frontend
    - name: Self-test the built app
      run: release/YouThumber.app/Contents/MacOS/YouThumber --self-test
    - name: Smoke-test the built app's server
      run: "app=release/YouThumber.app/Contents/MacOS/YouThumber\n\"$app\" --no-gui --no-browser --port 8799 > server.log\
        \ 2>&1 &\npid=$!\nfor _ in $(seq 60); do\n  curl -sf http://127.0.0.1:8799/health > /dev/null && break\n  sleep 2\n\
        done\nstatus=0\ncurl -sf http://127.0.0.1:8799/health || status=1\ncurl -sf -o /dev/null http://127.0.0.1:8799/ ||\
        \ status=1\ncurl -sf http://127.0.0.1:8799/matting-model || status=1\nkill \"$pid\" || true\nif [ \"$status\" != 0\
        \ ]; then cat server.log; exit 1; fi\n"
    - name: Verify Developer ID app signature
      run: codesign --verify --deep --strict --verbose=2 release/YouThumber.app
    - name: Create DMG
      run: "staging=$(mktemp -d)\nditto release/YouThumber.app \"$staging/YouThumber.app\"\nln -s /Applications \"$staging/Applications\"\
        \nhdiutil create -volname YouThumber -srcfolder \"$staging\" -ov -format UDZO \\\n  \"release/YouThumber-macOS-arm64.dmg\"\
        \n"
    - name: Sign and verify DMG
      env:
        APPLE_SIGNING_IDENTITY: 'Developer ID Application: Olli Sulopuisto (LWSR8T5392)'
      run: 'DMG_PATH="release/YouThumber-macOS-arm64.dmg"

        codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$DMG_PATH"

        codesign --verify --verbose=2 "$DMG_PATH"

        '
    - name: Notarize and staple DMG
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        APPLE_TEAM_ID: LWSR8T5392
      run: "set -euo pipefail\ntest -n \"$APPLE_ID\"\ntest -n \"$APPLE_APP_PASSWORD\"\nDMG_PATH=\"release/YouThumber-macOS-arm64.dmg\"\
        \nexport KEYCHAIN_PATH=\"$RUNNER_TEMP/youthumber-signing.keychain-db\"\nexport APPLE_TEAM_ID=\"${APPLE_TEAM_ID:-LWSR8T5392}\"\
        \npython3 \"$GITHUB_WORKSPACE/scripts/macos_ci_credentials.py\" store-notary-credentials\nxcrun notarytool submit\
        \ \"$DMG_PATH\" \\\n  --keychain-profile ci-notary --keychain \"$KEYCHAIN_PATH\" \\\n  --wait\nxcrun stapler staple\
        \ \"$DMG_PATH\"\nfor attempt in 1 2 3; do\n  if xcrun stapler validate \"$DMG_PATH\"; then break; fi\n  if [ \"$attempt\"\
        \ -eq 3 ]; then exit 1; fi\n  sleep \"$((attempt * 15))\"\ndone\n"
    - name: Remove signing keychain
      if: always()
      run: security delete-keychain "$RUNNER_TEMP/youthumber-signing.keychain-db" || true
    - name: Deliver verified versioned DMG directly to draft Release
      env:
        GH_TOKEN: ${{ github.token }}
      working-directory: ${{ github.workspace }}
      run: 'set -euo pipefail

        VERSION=$(python3 -c ''import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])'')

        [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)+$ ]]

        TAG="morning-${VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

        NAME="YouThumber-${VERSION}-manual.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}-macos-arm64.dmg"

        mkdir -p "$RUNNER_TEMP/morning-release"

        cp "release/YouThumber-macOS-arm64.dmg" "$RUNNER_TEMP/morning-release/$NAME"

        cd "$RUNNER_TEMP/morning-release"

        shasum -a 256 "$NAME" > SHA256.txt

        shasum -a 256 -c SHA256.txt

        cat > notes.md <<EOF

        Fresh Apple Silicon build from merged main $BUILD_SHA.

        App version: $VERSION. Build ID: $GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT.

        Developer ID signed, notarized and stapled by the existing packaging steps.

        Native feature/UI acceptance has not been performed. Draft test build, not a stable release.

        No Actions artifact/cache storage and no non-Mac builds.

        EOF

        gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "$NAME" SHA256.txt --target "$BUILD_SHA" --draft --prerelease
        --latest=false --title "YouThumber $VERSION arm64 TEST $GITHUB_RUN_ID" --notes-file notes.md

        '
    timeout-minutes: 90
    permissions:
      contents: write
