name: Build Desktop Binaries

# Every push to master builds and tests the app, so a packaging break shows up with the
# commit that caused it (the Sept 12 build went unbuilt for 18 versions and broke
# silently). A `v*` tag also publishes it as a GitHub Release.
on:
  push:
    branches: [master, main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-macos:
    name: Build macOS Standalone App (Apple Silicon)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Build Web Studio Frontend
        run: npm run build

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Python dependencies
        run: uv sync --all-groups

      - name: Read version
        id: version
        run: |
          version=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building YouThumber $version"

      - name: Tag must match the version being released
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject version ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Package macOS Standalone App Bundle
        run: uv run python scripts/build_binaries.py --skip-frontend

      # The packaged app, not the source tree: catches modules PyInstaller missed.
      - name: Self-test the built app
        run: release/YouThumber.app/Contents/MacOS/YouThumber --self-test

      - name: Smoke-test the built app's server
        run: |
          app=release/YouThumber.app/Contents/MacOS/YouThumber
          "$app" --no-gui --no-browser --port 8799 > server.log 2>&1 &
          pid=$!
          for _ in $(seq 60); do
            curl -sf http://127.0.0.1:8799/health > /dev/null && break
            sleep 2
          done
          status=0
          curl -sf http://127.0.0.1:8799/health || status=1
          curl -sf -o /dev/null http://127.0.0.1:8799/ || status=1
          curl -sf http://127.0.0.1:8799/matting-model || status=1
          kill "$pid" || true
          if [ "$status" != 0 ]; then cat server.log; exit 1; fi

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouThumber-macOS-arm64-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: release/YouThumber-macOS-*.zip
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/YouThumber-macOS-*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
