name: Build Desktop Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-macos:
    name: Build macOS Standalone App (Apple Silicon)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Build Web Studio Frontend
        run: npm run build

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Python dependencies
        run: uv sync --all-groups

      - name: Package macOS Standalone App Bundle
        run: uv run python scripts/build_binaries.py --skip-frontend

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouThumber-macOS-arm64
          path: release/YouThumber-macOS-*.zip
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/YouThumber-macOS-*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
