name: Build Desktop Binaries

# Packaging changes on master/main build and test the app. A `v*` tag always builds and
# publishes a GitHub Release; workflow_dispatch can be used to force a build.
on:
  push:
    branches: [master, main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect packaging changes
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      packaging: ${{ steps.filter.outputs.packaging }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Filter changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.ref_name }}
          filters: .github/filters.yml

  build-macos:
    name: Build macOS Standalone App (Apple Silicon)
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       startsWith(github.ref, 'refs/tags/v') ||
       needs.changes.outputs.packaging == 'true')
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Build Web Studio Frontend
        run: npm run build

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install Python dependencies
        run: uv sync --all-groups

      - name: Read version
        id: version
        run: |
          version=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building YouThumber $version"

      - name: Tag must match the version being released
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject version ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Package macOS Standalone App Bundle
        run: uv run python scripts/build_binaries.py --skip-frontend

      # The packaged app, not the source tree: catches modules PyInstaller missed.
      - name: Self-test the built app
        run: release/YouThumber.app/Contents/MacOS/YouThumber --self-test

      - name: Smoke-test the built app's server
        run: |
          app=release/YouThumber.app/Contents/MacOS/YouThumber
          "$app" --no-gui --no-browser --port 8799 > server.log 2>&1 &
          pid=$!
          for _ in $(seq 60); do
            curl -sf http://127.0.0.1:8799/health > /dev/null && break
            sleep 2
          done
          status=0
          curl -sf http://127.0.0.1:8799/health || status=1
          curl -sf -o /dev/null http://127.0.0.1:8799/ || status=1
          curl -sf http://127.0.0.1:8799/matting-model || status=1
          kill "$pid" || true
          if [ "$status" != 0 ]; then cat server.log; exit 1; fi

      - name: Create DMG
        run: |
          staging=$(mktemp -d)
          cp -R release/YouThumber.app "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname YouThumber -srcfolder "$staging" -ov -format UDZO \
            "release/YouThumber-macOS-arm64.dmg"

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: YouThumber-macOS-arm64-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: release/YouThumber-macOS-arm64.dmg
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: release/YouThumber-macOS-arm64.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
