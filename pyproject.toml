[project]
name = "youthumber"
version = "26.09.23.77"
description = "Local-first YouTube thumbnail editor with Apple Silicon background removal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pywebview>=5.0.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "pyobjc-framework-Vision>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-WebKit>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-AVFoundation>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-CoreMedia>=10.0; sys_platform == 'darwin'",
    "onnxruntime>=1.20",
    "torch>=2.4 ; sys_platform == 'darwin'",
    "torchvision>=0.19 ; sys_platform == 'darwin'",
    "transformers>=4.40,<5 ; sys_platform == 'darwin'",
    "timm>=1.0 ; sys_platform == 'darwin'",
    "kornia>=0.7 ; sys_platform == 'darwin'",
    "einops>=0.8 ; sys_platform == 'darwin'",
]

[project.scripts]
youthumber = "youthumber.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["youthumber"]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pyinstaller>=6.22.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

